<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C4CF9"/>
      <stop offset="1" stop-color="#3B2394"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- speed lines -->
  <g stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round">
    <line x1="10" y1="29" x2="20" y2="23" opacity="0.5"/>
    <line x1="14" y1="38" x2="24" y2="32" opacity="0.75"/>
    <line x1="19" y1="47" x2="29" y2="41" opacity="1"/>
  </g>
  <!-- magnifying glass -->
  <circle cx="46" cy="44" r="21" stroke="#FFFFFF" stroke-width="6.5" fill="none"/>
  <line x1="60.85" y1="58.85" x2="78" y2="76" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
  <!-- checkmark -->
  <path d="M37 45 L43.5 51.5 L57 32" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
